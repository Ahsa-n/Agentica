name: CI Ubuntu

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_DB: agentica_test
          POSTGRES_USER: agentica
          POSTGRES_PASSWORD: agentica
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      AGENTICA_DB_HOST: 127.0.0.1
      AGENTICA_DB_NAME: agentica_test
      AGENTICA_DB_USER: agentica
      AGENTICA_DB_PASSWORD: agentica

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install backend
        run: |
          cd backend
          pip install -e ".[dev]"

      - name: Lint
        run: cd backend && ruff check agentica tests

      - name: Run unit tests
        run: |
          cd backend
          pytest tests/unit -v --cov=agentica --cov-branch --cov-report=term-missing

      - name: Check policy engine coverage
        run: |
          cd backend
          pytest tests/unit/policy --cov=agentica.policy --cov-branch --cov-fail-under=90
