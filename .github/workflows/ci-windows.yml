name: CI Windows

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install backend
        # Same install as the Ubuntu job: a hand-picked package list left out sqlalchemy,
        # langgraph-checkpoint-postgres, paramiko, pywinrm, pywin32... and broke test collection.
        run: |
          cd backend
          pip install -e ".[dev]"

      - name: Lint
        run: cd backend && ruff check agentica tests

      - name: Run unit tests (no DB)
        run: |
          cd backend
          pytest tests/unit -v -k "not integration"
