# Router training examples — 15-30 per category
# Used by the two-stage embedding router

categories:
  monitoring:
    description: "System resource monitoring — CPU, memory, disk, network, processes"
    examples:
      - "What is the CPU usage right now?"
      - "How much memory is available?"
      - "Show me disk usage on all drives"
      - "What are the top processes by CPU?"
      - "Check the network statistics"
      - "Is the system under high load?"
      - "How much free disk space do I have?"
      - "Show me memory consumption"
      - "List processes consuming the most RAM"
      - "What is the system load average?"
      - "Check if any disk is nearly full"
      - "Show network interface stats"
      - "What processes are running?"
      - "Get system overview"
      - "Is the machine under stress?"
      - "How is the server performing?"
      - "Show me resource utilisation"
      - "Any CPU spikes recently?"
      - "Check process details for PID 1234"
      - "Memory usage breakdown"

  services:
    description: "System service management — start, stop, restart, status"
    examples:
      - "Is nginx running?"
      - "Start the apache service"
      - "Restart postgresql"
      - "Stop the web server"
      - "What services are running?"
      - "Check the status of the database service"
      - "List all active services"
      - "Restart IIS"
      - "Is the firewall service active?"
      - "Enable the SSH service"
      - "Disable the telnet service"
      - "Service nginx is down, restart it"
      - "Show all failed services"
      - "Which services are stopped?"
      - "Start Windows Update service"
      - "Restart the application server"
      - "Check if cron is running"
      - "List systemd units"
      - "Get service details for sshd"
      - "Is the web server healthy?"

  applications:
    description: "Application health — UP/DEGRADED/DOWN checks"
    examples:
      - "Is the application healthy?"
      - "Check the status of all monitored apps"
      - "Is the web app responding?"
      - "Application health check"
      - "Is the API server up?"
      - "Check if the database app is running"
      - "Show application status dashboard"
      - "Is the payment service accessible?"
      - "Check port 8080"
      - "Is anything down?"
      - "Which apps are degraded?"
      - "Health check on all services"
      - "Test HTTP endpoint"
      - "Check if nginx is serving"
      - "Application monitoring status"

  logs:
    description: "Log retrieval and inspection"
    examples:
      - "Show recent nginx logs"
      - "Get the last 100 lines of the application log"
      - "Any errors in the system log?"
      - "Show journal entries for sshd"
      - "What does the Windows event log say?"
      - "Recent error logs"
      - "Tail the web server log"
      - "Show log entries for the past hour"
      - "Any critical errors in the logs?"
      - "Get logs for the failed service"
      - "Show authentication logs"
      - "Check the event log for disk errors"
      - "Retrieve system journal"
      - "What errors occurred today?"
      - "Show last 50 log lines"

  network:
    description: "Network connectivity and port checks"
    examples:
      - "Check if port 443 is open"
      - "Is the network interface up?"
      - "Test connectivity to the server"
      - "What ports are listening?"
      - "Check network stats"
      - "Is port 22 reachable?"
      - "Network throughput"
      - "Any network errors?"
      - "Check DNS resolution"
      - "Test the VPN connection"
      - "What is the IP address?"
      - "Show open connections"
      - "Is the firewall blocking anything?"
      - "Check bandwidth usage"
      - "Network interface details"

  knowledge:
    description: "Knowledge base search — SOPs, procedures, documentation"
    examples:
      - "How do I restart the database?"
      - "What is the procedure for handling a full disk?"
      - "Show me the SOP for high memory usage"
      - "How should I handle a stopped service?"
      - "What steps do I follow for nginx restart?"
      - "Look up the runbook for this issue"
      - "What does the documentation say about this?"
      - "Find the procedure for IIS restart"
      - "Knowledge base search"
      - "What is best practice for this?"
      - "Show me the standard operating procedure"
      - "How was this issue handled before?"
      - "Find documentation about disk cleanup"
      - "What are the steps to resolve this?"
      - "Consult the runbook"
      - "Company procedure for server restart"
      - "Look up the incident response guide"

  remote:
    description: "Remote server management — SSH Linux or WinRM Windows"
    examples:
      - "Check CPU on the Linux server"
      - "What is the memory usage on web-server-1?"
      - "Restart nginx on the remote server"
      - "Check disk space on linux-prod"
      - "Get service status on Windows server"
      - "List processes on remote host"
      - "Check the Windows server health"
      - "SSH into the production box and check load"
      - "Remote server monitoring"
      - "Get logs from web-server-1"
      - "Is the remote service running?"
